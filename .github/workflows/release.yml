name: Release C128plus core

# Publishes the core from a finished build run (the exact file that was
# tested), together with BASIC 7.1 and its test programs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.8'
        required: true
      run_id:
        description: 'ID of the "Build C128plus core" run whose C128plus-core artifact to release'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -n C128plus-core -D core
          ls -l core

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${{ inputs.tag }}.md"
          gh release create "${{ inputs.tag }}" \
            core/*.rbf \
            basic71/boot2.rom \
            basic71/test/*.prg \
            --target "${{ github.sha }}" \
            --title "C128+ ${{ inputs.tag }}" \
            --notes-file "$notes"
